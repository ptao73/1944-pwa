<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>

  <meta name="description" content="经典空战《1944》伪3D重制版 — 追尾视角·透视纵深·Boss战·武器升级·合成音效"/>
  <link rel="manifest" href="./manifest.json">

  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{width:100%;height:100%;overflow:hidden;background:#000;touch-action:none;}
    #c{display:block;position:fixed;top:0;left:0;width:100%;height:100%;}
    #btn-loop{
      position:fixed;right:20px;bottom:30px;
      width:70px;height:70px;border-radius:50%;border:none;outline:none;
      font-family:'Courier New',monospace;font-size:12px;font-weight:bold;
      color:#fff;letter-spacing:1px;z-index:30;
      background:radial-gradient(circle,#0088ff,#004488);
      box-shadow:0 0 18px #0088ff;
      display:none;
    }
    #btn-mute{
      position:fixed;left:20px;bottom:30px;
      width:44px;height:44px;border-radius:50%;border:none;outline:none;

      background:rgba(0,60,120,.55);

    }
    @supports(padding-bottom:env(safe-area-inset-bottom)){

<body>
<canvas id="c"></canvas>
<button id="btn-loop">LOOP</button>
<button id="btn-mute">🔊</button>
<script>
'use strict';
// ============================================================
//  1944: Pacific Strike 3D — 追尾视角伪3D重制版
//  透视投影: screen = center + world * FOV/(FOV+z)
//  世界坐标: x 左右 / y 下为正(0=地平线高度) / z 纵深(0=玩家平面)
// ============================================================
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const btnLoopEl = document.getElementById('btn-loop');
const btnMuteEl = document.getElementById('btn-mute');

// ---- Sound: WebAudio 合成音效（零素材） ---------------------
let audioCtx=null;
let muted=localStorage.getItem('1944v3_mute')==='1';
function ensureAudio(){
  if(!audioCtx){
    try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  }
  if(audioCtx.state==='suspended')audioCtx.resume();
}
function tone(freq,dur,type,vol,slideTo,when){
  if(muted||!audioCtx)return;
  const t0=audioCtx.currentTime+(when||0);
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,t0);
  if(slideTo)o.frequency.exponentialRampToValueAtTime(Math.max(slideTo,1),t0+dur);
  g.gain.setValueAtTime(vol,t0);
  g.gain.exponentialRampToValueAtTime(.001,t0+dur);
  o.connect(g);g.connect(audioCtx.destination);
  o.start(t0);o.stop(t0+dur+.02);
}
function noiseBurst(dur,vol,when){
  if(muted||!audioCtx)return;
  const t0=audioCtx.currentTime+(when||0);
  const len=Math.floor(audioCtx.sampleRate*dur);
  const buf=audioCtx.createBuffer(1,len,audioCtx.sampleRate);
  const data=buf.getChannelData(0);
  for(let i=0;i<len;i++)data[i]=(Math.random()*2-1)*(1-i/len);
  const src=audioCtx.createBufferSource();src.buffer=buf;
  const g=audioCtx.createGain();g.gain.setValueAtTime(vol,t0);
  g.gain.exponentialRampToValueAtTime(.001,t0+dur);
  src.connect(g);g.connect(audioCtx.destination);src.start(t0);
}
const SFX={
  shoot(){tone(900,.05,'square',.03,500);},
  hit(){tone(260,.06,'sawtooth',.05,120);},
  explode(){noiseBurst(.25,.18);tone(110,.22,'triangle',.14,50);},
  explodeBig(){noiseBurst(.55,.26);tone(70,.5,'triangle',.2,30);},
  powerup(){tone(523,.08,'square',.1);tone(659,.08,'square',.1,0,.08);tone(784,.12,'square',.1,0,.16);},
  gunUp(){tone(440,.07,'square',.1);tone(660,.07,'square',.1,0,.07);tone(880,.1,'square',.1,0,.14);},
  playerHit(){tone(300,.4,'sawtooth',.16,60);noiseBurst(.4,.2);},
  loop(){tone(200,.6,'sine',.18,1200);noiseBurst(.5,.13,.1);},
  bossWarn(){tone(160,.25,'square',.14);tone(160,.25,'square',.14,0,.35);tone(160,.25,'square',.14,0,.7);},
  bossDie(){noiseBurst(.8,.28);tone(50,.9,'triangle',.22,25);}
};
function toggleMute(){
  muted=!muted;
  localStorage.setItem('1944v3_mute',muted?'1':'0');
  btnMuteEl.textContent=muted?'🔇':'🔊';
}
btnMuteEl.textContent=muted?'🔇':'🔊';

// ---- Resize & 投影 ------------------------------------------
let CW,CH,DPR,HOR,GY,MAXX,MINY,MAXY;
const FOV=350;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  CW=window.innerWidth; CH=window.innerHeight;
  canvas.width=CW*DPR; canvas.height=CH*DPR;
  canvas.style.width=CW+'px'; canvas.style.height=CH+'px';
  ctx.scale(DPR,DPR);
  HOR=CH*.40;          // 地平线屏幕高度
  GY=CH*.52;           // 海面的世界 y（z=0 处投影到屏幕底部附近）
  MAXX=CW*.44; MINY=-CH*.02; MAXY=GY-60;
  initStars();initClouds();initIslands();
}
window.addEventListener('resize',resize);
function scaleAt(z){return FOV/(FOV+z);}
function project(x,y,z){
  const s=FOV/(FOV+z);
  return {x:CW/2+x*s, y:HOR+y*s, s};
}

// ---- Shake -------------------------------------------------
let shakeX=0,shakeY=0,shakeMag=0;
function addShake(mag){shakeMag=Math.max(shakeMag,mag);}
function updateShake(){
  if(shakeMag>0.3){
    shakeX=(Math.random()-.5)*shakeMag*2;
    shakeY=(Math.random()-.5)*shakeMag*2;
    shakeMag*=0.78;
  } else {shakeX=shakeY=shakeMag=0;}
}

// ---- 天空 / 星 / 太阳 ---------------------------------------
let stars=[];
function initStars(){
  stars=[];
  for(let i=0;i<70;i++) stars.push({
    x:Math.random()*CW,y:Math.random()*HOR*.85,
    s:Math.random()*1.4+.3,a:Math.random()*.7+.2,tw:Math.random()*Math.PI*2
  });
}
function drawSky(){
  const sky=ctx.createLinearGradient(0,0,0,HOR);
  sky.addColorStop(0,'#000510');sky.addColorStop(.6,'#001830');sky.addColorStop(1,'#063055');
  ctx.fillStyle=sky;ctx.fillRect(0,0,CW,HOR);
  ctx.save();
  stars.forEach(st=>{
    ctx.globalAlpha=st.a*(.7+.3*Math.sin(frame*.04+st.tw));
    ctx.fillStyle='#fff';ctx.fillRect(st.x,st.y,st.s,st.s);
  });
  ctx.restore();
  // 落日余晖
  const sg=ctx.createRadialGradient(CW*.78,HOR*.55,4,CW*.78,HOR*.55,CH*.3);
  sg.addColorStop(0,'rgba(255,180,90,.55)');sg.addColorStop(.3,'rgba(255,120,60,.18)');sg.addColorStop(1,'rgba(255,100,50,0)');
  ctx.fillStyle=sg;ctx.fillRect(0,0,CW,HOR+30);
}

// ---- 海面（透视条带向镜头滚动） -----------------------------
let zScroll=0;
const STRIPE=150,SEA_ROWS=26;
function updateSea(spd){zScroll=(zScroll+spd)%STRIPE;}
function drawSea(){
  const sea=ctx.createLinearGradient(0,HOR,0,CH);
  sea.addColorStop(0,'#0a3a5c');sea.addColorStop(.35,'#06304e');sea.addColorStop(1,'#021a30');
  ctx.fillStyle=sea;ctx.fillRect(0,HOR,CW,CH-HOR);
  // 地平线辉光
  const hg=ctx.createLinearGradient(0,HOR-12,0,HOR+26);
  hg.addColorStop(0,'rgba(255,150,80,0)');hg.addColorStop(.45,'rgba(120,200,255,.25)');hg.addColorStop(1,'rgba(0,120,200,0)');
  ctx.fillStyle=hg;ctx.fillRect(0,HOR-12,CW,38);
  // 透视波纹条带：z 由远及近
  ctx.save();
  for(let i=SEA_ROWS;i>=1;i--){
    const z=i*STRIPE-zScroll;
    if(z<20)continue;
    const s=scaleAt(z);
    const y=HOR+GY*s;
    if(y>CH+20)continue;
    ctx.globalAlpha=.06+.4*s;
    ctx.strokeStyle=`hsl(${195+s*25},75%,${42+s*28}%)`;
    ctx.lineWidth=.6+3.4*s;
    ctx.beginPath();
    const cols=Math.ceil(CW/26)+2;
    for(let c=0;c<=cols;c++){
      const sx=(c/cols)*CW;
      const wob=Math.sin(c*.7+z*.013+frame*.06)*(2+9*s);
      c===0?ctx.moveTo(sx,y+wob):ctx.lineTo(sx,y+wob);
    }
    ctx.stroke();
  }
  ctx.restore();
}

// ---- 岛屿（贴在海面的远景帐篷） ------------------------------
let islands=[];
function initIslands(){
  islands=[];
  for(let i=0;i<5;i++) islands.push(newIsland(true));
}
function newIsland(init){
  return {x:(Math.random()-.5)*CW*4.5,z:init?500+Math.random()*4000:4200+Math.random()*800,
    w:120+Math.random()*220,hue:115+Math.random()*45};
}
function drawIsland(is,p){
  const w=is.w*p.s,h=is.w*.3*p.s;
  const gy=HOR+GY*p.s;
  ctx.save();ctx.globalAlpha=Math.min(.85,.15+p.s*1.4);
  const g=ctx.createLinearGradient(0,gy-h,0,gy);
  g.addColorStop(0,`hsl(${is.hue},42%,${30+p.s*14}%)`);
  g.addColorStop(1,`hsl(${is.hue},35%,12%)`);
  ctx.fillStyle=g;ctx.beginPath();
  ctx.moveTo(p.x-w,gy);ctx.quadraticCurveTo(p.x-w*.25,gy-h*1.6,p.x+w*.1,gy-h*.5);
  ctx.quadraticCurveTo(p.x+w*.5,gy-h*.9,p.x+w,gy);ctx.closePath();ctx.fill();
  // 海岸反光
  ctx.globalAlpha*=.5;ctx.fillStyle='rgba(160,220,255,.5)';
  ctx.fillRect(p.x-w,gy-1,w*2,2);
  ctx.restore();
}

// ---- 云层（纵深 billboard） ---------------------------------
let clouds=[];
function initClouds(){
  clouds=[];
  for(let i=0;i<10;i++) clouds.push(newCloud(true));
}
function newCloud(init){
  return {x:(Math.random()-.5)*CW*3.5,y:-(GY*.25+Math.random()*GY*.85),
    z:init?Math.random()*3800:3800+Math.random()*600,
    w:90+Math.random()*150,drift:(Math.random()-.5)*.6};
}
function drawCloud(c,p){
  const w=c.w*p.s*2.2,h=c.w*.4*p.s*2.2;
  ctx.save();ctx.globalAlpha=Math.min(.5,.08+p.s*.55);
  const g=ctx.createRadialGradient(p.x,p.y,2,p.x,p.y,w*.55);
  g.addColorStop(0,'rgba(190,225,255,.95)');g.addColorStop(.6,'rgba(130,185,235,.5)');g.addColorStop(1,'rgba(110,170,225,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(p.x,p.y,w*.5,h*.5,0,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

// ---- 3D 粒子 -------------------------------------------------
let particles=[];
function addParticles3(x,y,z,n,opts){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,b=Math.random()*Math.PI;
    const spd=(opts.minSpd||1)+Math.random()*(opts.maxSpd||4);
    particles.push({
      x,y,z,
      vx:Math.cos(a)*Math.sin(b)*spd,vy:Math.sin(a)*Math.sin(b)*spd,
      vz:Math.cos(b)*spd*6,
      life:1,decay:.012+Math.random()*(opts.decayVar||.025),
      size:(opts.minSize||2)+Math.random()*(opts.sizeVar||4),
      color:opts.colors[Math.floor(Math.random()*opts.colors.length)],
      gravity:opts.gravity||0
    });
  }
}
function updateParticles(){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx;p.y+=p.vy;p.z+=p.vz;p.vy+=p.gravity;p.life-=p.decay;
    if(p.life<=0||p.z<-FOV+80)particles.splice(i,1);
  }
}
function drawParticle(p,pr){
  ctx.save();
  ctx.globalAlpha=Math.max(0,p.life)*Math.min(1,.3+pr.s);
  ctx.fillStyle=p.color;ctx.shadowBlur=p.size*2*pr.s;ctx.shadowColor=p.color;
  ctx.beginPath();ctx.arc(pr.x,pr.y,Math.max(.4,p.size*p.life*pr.s*1.6),0,Math.PI*2);ctx.fill();
  ctx.restore();
}
function spawnExplosion3(x,y,z,big){
  addParticles3(x,y,z,big?44:22,{minSpd:1,maxSpd:big?8:5,
    colors:['#fff','#ffee44','#ff8800','#ff4400','#ff2200'],minSize:3,sizeVar:big?6:4,decayVar:.02,gravity:.07});
  addParticles3(x,y,z,big?18:8,{minSpd:.5,maxSpd:2.5,
    colors:['#ffcc00','#ff8800'],minSize:4,sizeVar:5,decayVar:.008,gravity:.02});
  addShake(big?10:5);
}

// ---- 子弹 ----------------------------------------------------
let playerBullets=[],enemyBullets=[];
function firePlayerBullet(ox,oy){
  playerBullets.push({x:player.x+ox,y:player.y+oy,z:10,vz:95});
}
function fireEnemyBullet(x,y,z,spd){
  const dx=player.x-x,dy=player.y-y,dz=0-z;
  const d=Math.sqrt(dx*dx+dy*dy+dz*dz)||1;
  enemyBullets.push({x,y,z,vx:dx/d*spd,vy:dy/d*spd,vz:dz/d*spd});
}
function updateBullets(){
  for(let i=playerBullets.length-1;i>=0;i--){
    const b=playerBullets[i];b.z+=b.vz;
    if(b.z>2600)playerBullets.splice(i,1);
  }
  for(let i=enemyBullets.length-1;i>=0;i--){
    const b=enemyBullets[i];
    b.x+=b.vx;b.y+=b.vy;b.z+=b.vz;
    if(b.z<=12){
      if(gameState===GS.PLAY&&!player.loopActive&&player.invincible<=0&&
         Math.abs(b.x-player.x)<34&&Math.abs(b.y-player.y)<34){
        enemyBullets.splice(i,1);playerHit();continue;
      }
      if(b.z<-FOV+80){enemyBullets.splice(i,1);continue;}
    }
  }
}
function drawPlayerBullet(b,p){
  const p2=project(b.x,b.y,b.z+70);
  ctx.save();
  ctx.strokeStyle='rgba(120,255,180,.9)';ctx.lineWidth=Math.max(1,3.6*p.s);
  ctx.shadowBlur=8;ctx.shadowColor='#00ff88';
  ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p2.x,p2.y);ctx.stroke();
  ctx.restore();
}
function drawEnemyBullet(b,p){
  const r=Math.max(1.5,11*p.s);
  ctx.save();
  const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,r);
  g.addColorStop(0,'#fff');g.addColorStop(.35,'#ff8866');g.addColorStop(1,'rgba(255,40,20,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

// ---- 螺旋桨（正面视角：模糊桨盘+旋转桨叶） -------------------
function drawPropFront(x,y,r){
  const ph=Date.now()*.025+x*.5;
  ctx.save();
  ctx.fillStyle='rgba(200,220,235,.13)';
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='rgba(230,240,255,.65)';ctx.lineWidth=Math.max(1,r*.12);
  ctx.beginPath();
  ctx.moveTo(x+Math.cos(ph)*r,y+Math.sin(ph)*r);
  ctx.lineTo(x-Math.cos(ph)*r,y-Math.sin(ph)*r);
  ctx.moveTo(x+Math.cos(ph+Math.PI/2)*r*.9,y+Math.sin(ph+Math.PI/2)*r*.9);
  ctx.lineTo(x-Math.cos(ph+Math.PI/2)*r*.9,y-Math.sin(ph+Math.PI/2)*r*.9);
  ctx.stroke();
  ctx.fillStyle='#16161e';
  ctx.beginPath();ctx.arc(x,y,r*.2,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

// ---- 玩家（追尾视角：从后方看 P-38） ------------------------
const player={
  x:0,y:0,w:110,
  speed:7,bank:0,pitch:0,
  invincible:0,
  shootTimer:0,shootRate:9,
  gunLevel:1,maxGunLevel:4,
  loopCharge:0,loopActive:false,loopTimer:0,
  allies:[]
};
let prevPX=0,prevPY=0;
function resetPlayer(){
  player.x=0;player.y=GY*.62;
  player.invincible=120;player.shootTimer=0;
  player.bank=0;player.pitch=0;prevPX=player.x;prevPY=player.y;
}
function drawShipRear(sx,sy,sc,bank,alpha,tint){
  ctx.save();ctx.globalAlpha=alpha;
  ctx.translate(sx,sy);ctx.rotate(bank*.5);ctx.scale(sc,sc);
  if(tint)ctx.filter=`hue-rotate(${tint}deg) brightness(1.3)`;
  // 海面投影
  // 水平尾翼（双垂尾之间）
  const tg=ctx.createLinearGradient(0,-14,0,-7);
  tg.addColorStop(0,'hsl(210,68%,50%)');tg.addColorStop(1,'hsl(213,62%,28%)');
  ctx.fillStyle=tg;ctx.fillRect(-27,-13,54,6);
  // 双垂直尾翼
  for(const d of[-1,1]){
    const fg=ctx.createLinearGradient((27*d-4),0,(27*d+4),0);
    fg.addColorStop(0,'#1c466f');fg.addColorStop(.45,'#7ab8f2');fg.addColorStop(1,'#123a60');
    ctx.fillStyle=fg;ctx.beginPath();
    ctx.moveTo(27*d-4,-7);ctx.lineTo(27*d-1,-30);ctx.quadraticCurveTo(27*d+2,-32,27*d+3,-28);
    ctx.lineTo(27*d+4,-7);ctx.closePath();ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.5)';ctx.fillRect(27*d-1,-31,2,3); // 翼尖灯
  }
  // 主翼两半（上反角 + 滚转明暗）
  for(const d of[-1,1]){
    const lift=1+(d===-1?bank:-bank)*.4;
    const wg=ctx.createLinearGradient(0,-9,0,4);
    wg.addColorStop(0,`hsl(210,75%,${Math.min(74,56*lift)}%)`);
    wg.addColorStop(1,`hsl(213,65%,${Math.min(44,24*lift)}%)`);
    ctx.fillStyle=wg;ctx.beginPath();
    ctx.moveTo(8*d,-2);ctx.lineTo(55*d,-9);ctx.lineTo(55*d,-4);ctx.lineTo(8*d,3);
    ctx.closePath();ctx.fill();
    ctx.strokeStyle=`rgba(255,255,255,${.3*lift})`;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(9*d,-2.5);ctx.lineTo(54*d,-9);ctx.stroke();
    // 翼尖航灯：左红右绿
    if(Math.floor(frame/26)%2===0){
      ctx.fillStyle=d<0?'#ff4444':'#44ff66';ctx.shadowBlur=6;ctx.shadowColor=ctx.fillStyle;
      ctx.beginPath();ctx.arc(55*d,-6.5,2,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    }
  }
  // 双引擎短舱（尾部对着镜头）+ 喷焰
  for(const d of[-1,1]){
    const flick=.7+Math.random()*.5;
    const eg=ctx.createRadialGradient(20*d,2,0,20*d,2,11*flick);
    eg.addColorStop(0,'rgba(255,200,80,.95)');eg.addColorStop(.4,'rgba(255,110,20,.55)');eg.addColorStop(1,'rgba(255,60,0,0)');
    ctx.fillStyle=eg;ctx.beginPath();ctx.arc(20*d,2,11*flick,0,Math.PI*2);ctx.fill();
    const ng=ctx.createLinearGradient(20*d-7,0,20*d+7,0);
    ng.addColorStop(0,'#16395e');ng.addColorStop(.4,'#6fb1ec');ng.addColorStop(1,'#0e2f50');
    ctx.fillStyle=ng;ctx.beginPath();ctx.ellipse(20*d,-3,6.5,7.5,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#0a1c30';
    ctx.beginPath();ctx.ellipse(20*d,1.5,4,3,0,0,Math.PI*2);ctx.fill(); // 喷口
  }
  // 中央短舱 + 座舱盖
  const fgr=ctx.createLinearGradient(-9,0,9,0);
  fgr.addColorStop(0,'#1d4a78');fgr.addColorStop(.4,'#9ed1ff');fgr.addColorStop(1,'#123a63');
  ctx.fillStyle=fgr;ctx.beginPath();ctx.ellipse(0,-5,8.5,8,0,0,Math.PI*2);ctx.fill();
  const cg=ctx.createLinearGradient(-5,-15,5,-6);
  cg.addColorStop(0,'rgba(225,245,255,.95)');cg.addColorStop(1,'rgba(40,100,170,.9)');
  ctx.fillStyle=cg;ctx.beginPath();ctx.ellipse(0,-11,5,4,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.7)';
  ctx.beginPath();ctx.ellipse(-1.5,-12.5,1.5,1,0,0,Math.PI*2);ctx.fill();
  ctx.restore();
}
function drawPlayer(){
  if(player.invincible>0&&Math.floor(player.invincible/5)%2===1)return;
  // 海面投影（贴地，越高越淡）
  const gp=project(player.x,GY,0);
  const alt=(GY-player.y)/GY;
  ctx.save();ctx.globalAlpha=.25*(1-alt*.55);ctx.fillStyle='#000';
  ctx.beginPath();ctx.ellipse(gp.x+10,gp.y,46*(1-alt*.3),9,player.bank*.2,0,Math.PI*2);ctx.fill();
  ctx.restore();
  // 僚机（绕玩家椭圆轨道，滚转跟随）
  player.allies.forEach(a=>{
    const ax=player.x+Math.cos(a.angle)*78,ay=player.y+Math.sin(a.angle)*36;
    const ap=project(ax,ay,0);
    drawShipRear(ap.x,ap.y,.62,-Math.sin(a.angle)*.9,.85,165);
  });
  const pp=project(player.x,player.y,0);
  drawShipRear(pp.x,pp.y,1,player.bank,1,0);
  // Loop 激活光环
  if(player.loopActive){
    const t=player.loopTimer/200;
    ctx.save();ctx.strokeStyle='#00ffff';ctx.lineWidth=3;
    ctx.globalAlpha=t*.6;ctx.shadowBlur=20;ctx.shadowColor='#00ffff';
    ctx.beginPath();ctx.arc(pp.x,pp.y-6,(1-t)*240+50,0,Math.PI*2);ctx.stroke();ctx.restore();
  }
}
function drawCrosshair(){
  if(gameState!==GS.PLAY)return;
  const c1=project(player.x,player.y-6,700);
  const c2=project(player.x,player.y-6,1500);
  ctx.save();
  ctx.strokeStyle='rgba(0,255,200,.75)';ctx.lineWidth=1.5;
  ctx.shadowBlur=6;ctx.shadowColor='#00ffc8';
  ctx.beginPath();ctx.arc(c1.x,c1.y,13,0,Math.PI*2);ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(c1.x-19,c1.y);ctx.lineTo(c1.x-8,c1.y);
  ctx.moveTo(c1.x+8,c1.y);ctx.lineTo(c1.x+19,c1.y);
  ctx.moveTo(c1.x,c1.y-19);ctx.lineTo(c1.x,c1.y-8);
  ctx.moveTo(c1.x,c1.y+8);ctx.lineTo(c1.x,c1.y+19);

// ---- 敌机（正面视角，由远处飞来） ----------------------------
let enemies=[];
const ETYPES=[
  {hp:1,wing:64, body:10,score:100,shotRate:0,  vz:-19},
  {hp:2,wing:88, body:12,score:250,shotRate:95, vz:-13},
  {hp:5,wing:128,body:16,score:500,shotRate:60, vz:-9}
];
const EPAL=[{h:358,sat:66},{h:26,sat:70},{h:18,sat:42}];
function spawnEnemy(lvl,fx,fz){
  const typeIdx=Math.random()<.6?0:(Math.random()<.6?1:2);
  const T=ETYPES[typeIdx];
  enemies.push({
    x:fx!==undefined?fx:(Math.random()-.5)*CW*.8,
    y:GY*(.15+Math.random()*.55),
    z:fz!==undefined?fz:2600,
    type:typeIdx,
    hp:T.hp+Math.floor(lvl/3),maxHp:T.hp+Math.floor(lvl/3),
    wing:T.wing,score:T.score,
    vz:(T.vz-lvl*.7),vx:(Math.random()-.5)*2.4,
    shotRate:T.shotRate,shotTimer:T.shotRate?30+Math.floor(Math.random()*T.shotRate):9999,
    sinAmp:typeIdx===0?(1.5+Math.random()*2):.7,sinFreq:.02+Math.random()*.03,
    age:0,bank:0
  });
}
function updateEnemies(){
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];e.age++;
    e.z+=e.vz;
    const wob=Math.sin(e.age*e.sinFreq)*e.sinAmp;
    e.x+=e.vx+wob;
    e.bank+=((e.vx+wob)/2.4-e.bank)*.1;
    if(e.x<-CW*.55)e.x=-CW*.55;if(e.x>CW*.55)e.x=CW*.55;
    // 与玩家相撞（穿过 z=0 平面时判定）
    if(e.z<30&&e.z>-40&&gameState===GS.PLAY&&!player.loopActive&&player.invincible<=0&&
       Math.abs(e.x-player.x)<e.wing*.42+28&&Math.abs(e.y-player.y)<42){
      spawnExplosion3(e.x,e.y,e.z,e.type===2);enemies.splice(i,1);playerHit();continue;
    }
    if(e.z<-180){enemies.splice(i,1);continue;}
    // 开火（中距离）
    if(e.shotRate>0&&e.z>420&&e.z<2100){
      e.shotTimer--;
      if(e.shotTimer<=0){
        e.shotTimer=e.shotRate+Math.floor(Math.random()*30);
        fireEnemyBullet(e.x,e.y,e.z,e.type===2?34:27);
      }
    }
  }
}
function drawEnemy(e,p){
  const P=EPAL[e.type];
  const hsl=(l,a)=>`hsla(${P.h},${P.sat}%,${l}%,${a==null?1:a})`;
  const sc=p.s*1.9;
  ctx.save();ctx.translate(p.x,p.y);ctx.rotate(-e.bank*.4);ctx.scale(sc,sc);
  const R=ETYPES[e.type].body,W=e.wing/2;
  // 垂直尾翼（机身上方露出）
  const vg=ctx.createLinearGradient(0,-R*2.4,0,-R*.6);
  vg.addColorStop(0,hsl(38));vg.addColorStop(1,hsl(16));
  ctx.fillStyle=vg;ctx.beginPath();
  ctx.moveTo(-2,-R*2.3);ctx.lineTo(2,-R*2.3);ctx.lineTo(4.5,-R*.6);ctx.lineTo(-4.5,-R*.6);
  ctx.closePath();ctx.fill();
  // 主翼两半（滚转明暗）
  for(const d of[-1,1]){
    const lift=1+(d===1?e.bank:-e.bank)*.35;
    const wg=ctx.createLinearGradient(0,-3,0,7);
    wg.addColorStop(0,hsl(Math.min(60,46*lift)));
    wg.addColorStop(1,hsl(Math.min(32,20*lift)));
    ctx.fillStyle=wg;ctx.beginPath();
    ctx.moveTo(R*.5*d,-1);ctx.lineTo(W*d,4);ctx.lineTo(W*d,8);ctx.lineTo(R*.5*d,4);
    ctx.closePath();ctx.fill();
    // 翼尖航灯
    if(Math.floor((frame+e.age)/24)%2===0){
      ctx.fillStyle=d<0?'#ff5555':'#55ff77';ctx.shadowBlur=5;ctx.shadowColor=ctx.fillStyle;
      ctx.beginPath();ctx.arc(W*d,6,1.8,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    }
  }
  if(e.type===1){
    // 双发：翼上两短舱+双桨
    for(const d of[-1,1]){
      const ng=ctx.createRadialGradient(-R*.25+W*.42*d,-R*.2,R*.1,W*.42*d,0,R*.8);
      ng.addColorStop(0,hsl(48));ng.addColorStop(1,hsl(14));
      ctx.fillStyle=ng;ctx.beginPath();ctx.arc(W*.42*d,1.5,R*.62,0,Math.PI*2);ctx.fill();
    }
  }
  // 机身（正面圆形发动机罩，左上受光）
  const bg=ctx.createRadialGradient(-R*.3,-R*.35,R*.12,0,0,R);
  bg.addColorStop(0,hsl(55));bg.addColorStop(.55,hsl(34));bg.addColorStop(1,hsl(12));
  ctx.fillStyle=bg;ctx.beginPath();ctx.arc(0,0,R,0,Math.PI*2);ctx.fill();
  // 座舱（机身上缘玻璃）
  const cg=ctx.createLinearGradient(0,-R*1.1,0,-R*.2);
  cg.addColorStop(0,'rgba(200,225,240,.9)');cg.addColorStop(1,'rgba(25,35,50,.95)');
  ctx.fillStyle=cg;ctx.beginPath();ctx.ellipse(0,-R*.62,R*.5,R*.4,0,0,Math.PI*2);ctx.fill();
  // 螺旋桨
  if(e.type===1){drawPropFront(-e.wing*.21,1.5,R*1.05);drawPropFront(e.wing*.21,1.5,R*1.05);}
  else drawPropFront(0,0,R*1.7);
  if(e.type===2){
    // 重型机：机鼻玻璃
    const ngl=ctx.createRadialGradient(-2,-2,1,0,0,R*.5);
    ngl.addColorStop(0,'rgba(190,215,230,.9)');ngl.addColorStop(1,'rgba(20,30,45,.6)');
    ctx.fillStyle=ngl;ctx.beginPath();ctx.arc(0,R*.25,R*.42,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
  // 血条（屏幕空间，不随滚转）
  if(e.maxHp>1){
    const bw=e.wing*sc*.7,bh=Math.max(2,4*sc);
    ctx.fillStyle='#300';ctx.fillRect(p.x-bw/2,p.y+R*sc+6*sc,bw,bh);
    ctx.fillStyle='#f00';ctx.fillRect(p.x-bw/2,p.y+R*sc+6*sc,bw*(e.hp/e.maxHp),bh);
  }
}

// ---- Boss（四发重型轰炸机，正面） ----------------------------
let boss=null,nextBossLevel=3,bossWarnTimer=0;
function spawnBoss(lvl){
  const hp=70+lvl*16;
  boss={x:0,y:GY*.32,z:3200,holdZ:1050,wing:340,body:30,
    hp,maxHp:hp,age:0,shotTimer:70,radialTimer:200,lvl,bank:0};
}
function updateBoss(){
  if(!boss)return;
  boss.age++;
  if(boss.z>boss.holdZ){boss.z-=16;return;} // 入场阶段不攻击
  const enraged=boss.hp<boss.maxHp*.5;
  const tx=Math.sin(boss.age*.011)*CW*.3;
  boss.bank+=((tx-boss.x)/40-boss.bank)*.06;
  boss.x=tx;
  boss.y=GY*.32+Math.sin(boss.age*.021)*GY*.1;
  boss.shotTimer--;
  if(boss.shotTimer<=0){
    boss.shotTimer=enraged?40:68;
    const spd=enraged?40:33;
    fireEnemyBullet(boss.x-boss.wing*.25,boss.y,boss.z,spd);
    fireEnemyBullet(boss.x,boss.y,boss.z,spd);
    fireEnemyBullet(boss.x+boss.wing*.25,boss.y,boss.z,spd);
  }
  boss.radialTimer--;
  if(boss.radialTimer<=0){
    boss.radialTimer=enraged?130:200;
    const n=enraged?14:10;
    for(let i=0;i<n;i++){
      const a=(i/n)*Math.PI*2+boss.age*.01;
      enemyBullets.push({x:boss.x,y:boss.y,z:boss.z,
        vx:Math.cos(a)*9,vy:Math.sin(a)*9,vz:-30});
    }
  }
}
function damageBoss(dmg,hx,hy,hz){
  if(!boss)return;
  boss.hp-=dmg;
  addParticles3(hx,hy,hz,5,{minSpd:1,maxSpd:3,colors:['#ff8800','#ffcc00'],minSize:2,sizeVar:3,decayVar:.05,gravity:.05});
  if(boss.hp<=0)killBoss();
}
function killBoss(){
  const b=boss;boss=null;
  score+=5000+b.lvl*500;
  for(let i=0;i<6;i++)
    spawnExplosion3(b.x+(Math.random()-.5)*b.wing*.7,b.y+(Math.random()-.5)*60,b.z,true);
  SFX.bossDie();addShake(22);
  spawnPowerup(b.x-40,b.y,b.z,true);spawnPowerup(b.x+40,b.y,b.z,true);
  enemyBullets=[];
  nextBossLevel=1+Math.floor(score/3000)+3;
}
function drawBoss(p){
  if(!boss)return;
  const enraged=boss.hp<boss.maxHp*.5;
  const hue=enraged?358:340,sat=enraged?70:45;
  const hsl=(l,a)=>`hsla(${hue},${sat}%,${l}%,${a==null?1:a})`;
  const sc=p.s*1.9,R=boss.body,W=boss.wing/2;
  ctx.save();ctx.translate(p.x,p.y);ctx.rotate(-boss.bank*.18);ctx.scale(sc,sc);
  // 垂直尾翼
  const vg=ctx.createLinearGradient(0,-R*2.6,0,-R*.5);
  vg.addColorStop(0,hsl(36));vg.addColorStop(1,hsl(14));
  ctx.fillStyle=vg;ctx.beginPath();
  ctx.moveTo(-4,-R*2.5);ctx.lineTo(4,-R*2.5);ctx.lineTo(9,-R*.5);ctx.lineTo(-9,-R*.5);
  ctx.closePath();ctx.fill();
  // 主翼
  for(const d of[-1,1]){

    wg.addColorStop(0,hsl(Math.min(50,38*lift)));
    wg.addColorStop(1,hsl(Math.min(28,16*lift)));
    ctx.fillStyle=wg;ctx.beginPath();
    ctx.moveTo(R*.5*d,-2);ctx.lineTo(W*d,7);ctx.lineTo(W*d,13);ctx.lineTo(R*.5*d,7);
    ctx.closePath();ctx.fill();
    if(Math.floor(boss.age/22)%2===0){
      ctx.fillStyle=d<0?'#ff5555':'#55ff77';ctx.shadowBlur=6;ctx.shadowColor=ctx.fillStyle;
      ctx.beginPath();ctx.arc(W*d,10,3,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    }
  }
  // 四引擎短舱
  for(const ex of[-.38,-.17,.17,.38]){
    const nx=boss.wing*ex;
    const ng=ctx.createRadialGradient(nx-3,-3,2,nx,2,R*.55);
    ng.addColorStop(0,hsl(46));ng.addColorStop(1,hsl(11));
    ctx.fillStyle=ng;ctx.beginPath();ctx.arc(nx,4,R*.42,0,Math.PI*2);ctx.fill();
  }
  // 机身
  const bg=ctx.createRadialGradient(-R*.3,-R*.35,R*.1,0,0,R);
  bg.addColorStop(0,hsl(50));bg.addColorStop(.55,hsl(30));bg.addColorStop(1,hsl(10));
  ctx.fillStyle=bg;ctx.beginPath();ctx.ellipse(0,0,R,R*.85,0,0,Math.PI*2);ctx.fill();
  // 驾驶舱玻璃带
  const cg=ctx.createLinearGradient(0,-R*.9,0,-R*.1);
  cg.addColorStop(0,'rgba(200,225,240,.9)');cg.addColorStop(1,'rgba(20,30,45,.95)');
  ctx.fillStyle=cg;ctx.beginPath();ctx.ellipse(0,-R*.45,R*.62,R*.3,0,0,Math.PI*2);ctx.fill();
  // 机鼻玻璃
  const ngl=ctx.createRadialGradient(-3,R*.15,2,0,R*.25,R*.5);
  ngl.addColorStop(0,'rgba(190,215,230,.9)');ngl.addColorStop(1,'rgba(20,30,45,.5)');
  ctx.fillStyle=ngl;ctx.beginPath();ctx.arc(0,R*.25,R*.45,0,Math.PI*2);ctx.fill();
  // 四螺旋桨
  for(const ex of[-.38,-.17,.17,.38]) drawPropFront(boss.wing*ex,4,R*.78);
  // 炮口闪光
  if(boss.shotTimer<6){
    ctx.fillStyle='rgba(255,220,120,.9)';ctx.shadowBlur=12;ctx.shadowColor='#ffcc44';
    for(const ex of[-.25,0,.25]){
      ctx.beginPath();ctx.arc(boss.wing*ex,R*.4,4,0,Math.PI*2);ctx.fill();
    }
    ctx.shadowBlur=0;
  }
  if(enraged&&Math.floor(boss.age/4)%2===0){
    ctx.globalAlpha=.2;ctx.fillStyle='#ff0000';
    ctx.beginPath();ctx.ellipse(0,0,W*1.05,R*2.4,0,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
  // 顶部血条
  const bw=Math.min(CW*.7,420),bh=10,bx=(CW-bw)/2,by=70;
  ctx.save();
  ctx.fillStyle='rgba(40,0,0,.7)';ctx.fillRect(bx,by,bw,bh);
  ctx.fillStyle=enraged?'#ff2200':'#ff6600';
  ctx.shadowBlur=8;ctx.shadowColor='#ff4400';
  ctx.fillRect(bx,by,bw*Math.max(0,boss.hp/boss.maxHp),bh);
  ctx.shadowBlur=0;ctx.strokeStyle='rgba(255,100,50,.6)';ctx.strokeRect(bx,by,bw,bh);
  ctx.font='bold 11px "Courier New"';ctx.fillStyle='#ffaa88';ctx.textAlign='center';
  ctx.fillText('BOSS',CW/2,by-5);
  ctx.restore();
}
function drawBossWarning(){
  if(bossWarnTimer<=0)return;
  if(Math.floor(bossWarnTimer/12)%2===0){
    ctx.save();ctx.textAlign='center';
    ctx.font='bold 30px "Courier New"';ctx.fillStyle='#ff2200';
    ctx.shadowBlur=24;ctx.shadowColor='#ff0000';
    ctx.fillText('⚠ WARNING ⚠',CW/2,CH*.4);

}

// ---- 道具 ----------------------------------------------------
let powerups=[];
function spawnPowerup(x,y,z,force){
  if(!force&&Math.random()>.35)return;
  const r=Math.random();
  const type=r<.4?'gun':(r<.7?'ally':'life');
  powerups.push({x,y,z,type,age:0});
}
function updatePowerups(){
  for(let i=powerups.length-1;i>=0;i--){
    const p=powerups[i];p.age++;p.z-=17;
    p.y+=Math.sin(p.age*.1)*.8;
    if(p.z<=30){
      if(Math.abs(p.x-player.x)<55&&Math.abs(p.y-player.y)<55&&gameState===GS.PLAY){
        powerups.splice(i,1);
        if(p.type==='life'){lives=Math.min(5,lives+1);SFX.powerup();}
        else if(p.type==='gun'){
          if(player.gunLevel<player.maxGunLevel)player.gunLevel++;
          else score+=500;
          SFX.gunUp();
        }
        else{
          if(player.allies.length<3)player.allies.push({angle:Math.PI*2*player.allies.length/3,shootTimer:0});
          SFX.powerup();
        }
        addParticles3(p.x,p.y,0,12,{minSpd:1,maxSpd:4,
          colors:p.type==='life'?['#ff4488','#ff88bb']:(p.type==='gun'?['#ffaa00','#ffdd66']:['#00ccff','#88eeff']),
          minSize:2,sizeVar:3,decayVar:.03,gravity:-.02});
        continue;
      }
      if(p.z<-120){powerups.splice(i,1);}
    }
  }
}
function drawPowerup(p,pr){
  ctx.save();ctx.translate(pr.x,pr.y);
  const pulse=(1+Math.sin(p.age*.15)*.15)*pr.s*2.2;
  ctx.scale(pulse,pulse);ctx.shadowBlur=14;
  if(p.type==='life'){ctx.shadowColor='#ff4488';ctx.fillStyle='#ff4488';}
  else if(p.type==='gun'){ctx.shadowColor='#ffaa00';ctx.fillStyle='#ffaa00';}
  else{ctx.shadowColor='#00ccff';ctx.fillStyle='#00ccff';}
  ctx.font='bold 22px serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(p.type==='life'?'♥':(p.type==='gun'?'P':'W'),0,0);ctx.restore();
}

// ---- Game State ---------------------------------------------
const GS={MENU:0,PLAY:1,DEAD:2,OVER:3};
let gameState=GS.MENU;
let score=0,hiScore=+(localStorage.getItem('1944_3d_hi')||0);
let lives=3,level=1,frame=0,deadTimer=0,spawnTimer=0;
let isPaused=false;

function startGame(){
  score=0;lives=3;level=1;frame=0;
  playerBullets=[];enemyBullets=[];enemies=[];powerups=[];particles=[];
  player.loopCharge=0;player.loopActive=false;player.allies=[];player.gunLevel=1;
  boss=null;bossWarnTimer=0;nextBossLevel=3;
  resetPlayer();gameState=GS.PLAY;
}
function playerHit(){
  if(player.invincible>0)return;
  lives--;spawnExplosion3(player.x,player.y,0,true);SFX.playerHit();
  player.gunLevel=Math.max(1,player.gunLevel-1);
  if(lives<=0){gameState=GS.OVER;if(score>hiScore){hiScore=score;localStorage.setItem('1944_3d_hi',hiScore);}}
  else{gameState=GS.DEAD;deadTimer=90;}
}

// ---- Input ---------------------------------------------------
const keys={};
let touchActive=false,touchTargetX=0,touchTargetY=0;
function isBtnTouch(x,y){
  for(const el of [btnLoopEl,btnMuteEl]){
    const btn=el.getBoundingClientRect();
    if(x>=btn.left&&x<=btn.right&&y>=btn.top&&y<=btn.bottom)return true;
  }
  return false;
}
canvas.addEventListener('touchstart',e=>{
  e.preventDefault();ensureAudio();
  for(let i=0;i<e.touches.length;i++){
    const t=e.touches[i];
    if(!isBtnTouch(t.clientX,t.clientY)){
      touchActive=true;touchTargetX=t.clientX;touchTargetY=t.clientY;break;
    }
  }
  if(gameState===GS.MENU||gameState===GS.OVER)startGame();
},{passive:false});
canvas.addEventListener('touchmove',e=>{
  e.preventDefault();
  for(let i=0;i<e.touches.length;i++){
    const t=e.touches[i];
    if(!isBtnTouch(t.clientX,t.clientY)){
      touchTargetX=t.clientX;touchTargetY=t.clientY;break;
    }
  }
},{passive:false});
canvas.addEventListener('touchend',e=>{
  e.preventDefault();
  let hasGameTouch=false;
  for(let i=0;i<e.touches.length;i++){
    if(!isBtnTouch(e.touches[i].clientX,e.touches[i].clientY)){hasGameTouch=true;break;}
  }
  if(!hasGameTouch)touchActive=false;
},{passive:false});
canvas.addEventListener('touchcancel',e=>{e.preventDefault();touchActive=false;},{passive:false});

btnLoopEl.addEventListener('touchstart',e=>{e.preventDefault();ensureAudio();tryLoop();},{passive:false});
btnLoopEl.addEventListener('click',()=>{ensureAudio();tryLoop();});
btnMuteEl.addEventListener('touchstart',e=>{e.preventDefault();ensureAudio();toggleMute();},{passive:false});
btnMuteEl.addEventListener('click',()=>{ensureAudio();toggleMute();});

window.addEventListener('keydown',e=>{
  keys[e.key]=true;ensureAudio();
  if(e.key===' ')e.preventDefault();
  if(e.key==='p'||e.key==='P') if(gameState===GS.PLAY) isPaused=!isPaused;
  if(e.key==='Enter'||e.key===' ') if(gameState===GS.MENU||gameState===GS.OVER) startGame();
  if(e.key==='l'||e.key==='L') tryLoop();
  if(e.key==='m'||e.key==='M') toggleMute();
});
window.addEventListener('keyup',e=>{keys[e.key]=false;});

// ---- Loop Attack ---------------------------------------------
function tryLoop(){
  if(player.loopCharge<100||player.loopActive)return;
  player.loopActive=true;player.loopTimer=200;player.loopCharge=0;
  enemies.forEach(e=>{spawnExplosion3(e.x,e.y,e.z,e.type===2);score+=e.score;});
  enemies=[];enemyBullets=[];addShake(18);SFX.loop();
  if(boss)damageBoss(25,boss.x,boss.y,boss.z);
  addParticles3(player.x,player.y,300,120,{minSpd:2,maxSpd:10,
    colors:['#fff','#ffff88','#ffcc00','#00ffff'],minSize:2,sizeVar:5,decayVar:.015,gravity:0});
}

// ---- Update --------------------------------------------------
function update(){
  frame++;level=1+Math.floor(score/3000);

  // 移动：触屏直接映射世界坐标（屏幕→世界为恒等映射，z=0 平面）
  if(touchActive){
    const wx=touchTargetX-CW/2, wy=touchTargetY-HOR;
    const dx=wx-player.x, dy=wy-player.y;
    const dist=Math.sqrt(dx*dx+dy*dy);
    const maxSpd=player.speed*3.4;
    if(dist>2){
      const spd=Math.min(maxSpd,dist*.25);
      player.x+=dx/dist*spd;player.y+=dy/dist*spd;
    }
  } else {
    const spd=player.speed;
    if(keys['ArrowLeft']||keys['a']||keys['A'])  player.x-=spd;
    if(keys['ArrowRight']||keys['d']||keys['D']) player.x+=spd;
    if(keys['ArrowUp']||keys['w']||keys['W'])    player.y-=spd;
    if(keys['ArrowDown']||keys['s']||keys['S'])  player.y+=spd;
  }
  player.x=Math.max(-MAXX,Math.min(MAXX,player.x));
  player.y=Math.max(MINY+50,Math.min(MAXY,player.y));

  // 滚转/俯仰平滑（视觉）
  player.bank+=(Math.max(-1,Math.min(1,(player.x-prevPX)/8))-player.bank)*.14;
  player.pitch+=(Math.max(-1,Math.min(1,(player.y-prevPY)/8))-player.pitch)*.14;
  prevPX=player.x;prevPY=player.y;

  if(player.invincible>0)player.invincible--;
  if(!player.loopActive)player.loopCharge=Math.min(100,player.loopCharge+.18);
  if(player.loopActive){player.loopTimer--;if(player.loopTimer<=0)player.loopActive=false;}

  // 自动开火（火力随 gunLevel）
  player.shootTimer--;
  if(player.shootTimer<=0){
    player.shootTimer=player.loopActive?5:player.shootRate;
    const g=player.loopActive?player.maxGunLevel:player.gunLevel;
    if(g===1)firePlayerBullet(0,-6);
    else if(g===2){firePlayerBullet(-12,-4);firePlayerBullet(12,-4);}
    else if(g===3){firePlayerBullet(0,-8);firePlayerBullet(-16,-2);firePlayerBullet(16,-2);}
    else{firePlayerBullet(-12,-6);firePlayerBullet(12,-6);firePlayerBullet(-24,0);firePlayerBullet(24,0);firePlayerBullet(0,-10);}
    SFX.shoot();
  }

  // 僚机轨道+射击
  player.allies.forEach(a=>{
    a.angle+=.045;
    a.shootTimer=(a.shootTimer||0)-1;
    if(a.shootTimer<=0){
      a.shootTimer=18;
      playerBullets.push({x:player.x+Math.cos(a.angle)*78,y:player.y+Math.sin(a.angle)*36,z:10,vz:95});
    }
  });

  // Boss 调度
  if(!boss&&bossWarnTimer<=0&&level>=nextBossLevel){bossWarnTimer=150;SFX.bossWarn();}
  if(bossWarnTimer>0){
    bossWarnTimer--;
    if(bossWarnTimer<=0)spawnBoss(level);
  }

  // 刷怪（Boss 战期间暂停；偶尔 V 字编队）
  spawnTimer--;
  if(spawnTimer<=0&&!boss&&bossWarnTimer<=0){
    spawnTimer=Math.max(20,75-level*5);
    if(Math.random()<.25){
      const fx=(Math.random()-.5)*CW*.5;
      spawnEnemy(level,fx,2600);spawnEnemy(level,fx-90,2800);spawnEnemy(level,fx+90,2800);
    } else spawnEnemy(level);
  }

  updateEnemies();updateBoss();updateBullets();updatePowerups();updateParticles();
  updateSea(22+level*1.5);
  clouds.forEach(c=>{c.z-=9;c.x+=c.drift;if(c.z<-200)Object.assign(c,newCloud(false));});
  islands.forEach(is=>{is.z-=15;if(is.z<-150)Object.assign(is,newIsland(false));});

  // 玩家子弹 vs 敌机/Boss（世界空间扫掠判定）
  for(let i=playerBullets.length-1;i>=0;i--){
    const b=playerBullets[i];
    let consumed=false;
    for(let j=enemies.length-1;j>=0;j--){
      const e=enemies[j];
      if(b.z<e.z+45&&b.z+b.vz>e.z-45&&
         Math.abs(b.x-e.x)<e.wing*.5+10&&Math.abs(b.y-e.y)<40){
        playerBullets.splice(i,1);e.hp--;consumed=true;
        addParticles3(b.x,b.y,e.z,5,{minSpd:1,maxSpd:3,colors:['#ff8800','#ffcc00'],minSize:2,sizeVar:2,decayVar:.05,gravity:.05});
        if(e.hp<=0){
          score+=e.score;spawnExplosion3(e.x,e.y,e.z,e.type===2);SFX.explode();
          spawnPowerup(e.x,e.y,e.z);enemies.splice(j,1);
        } else SFX.hit();
        break;
      }
    }
    if(!consumed&&boss&&b.z<boss.z+60&&b.z+b.vz>boss.z-60&&
       Math.abs(b.x-boss.x)<boss.wing*.45&&Math.abs(b.y-boss.y)<70){
      playerBullets.splice(i,1);
      damageBoss(1,b.x,b.y,boss.z);SFX.hit();
    }
  }

  updateShake();

  if('ontouchstart' in window){
    btnLoopEl.style.display='block';
    btnMuteEl.style.display='block';
    btnLoopEl.style.opacity=player.loopCharge>=100?'1':'0.45';
    btnLoopEl.style.boxShadow=player.loopCharge>=100?'0 0 24px #00ffff':'0 0 10px #0055aa';
    btnLoopEl.style.background=player.loopCharge>=100?
      'radial-gradient(circle,#00ffff,#0088ff)':
      'radial-gradient(circle,#0066cc,#003366)';
  }
}

// ---- HUD -----------------------------------------------------
function drawHUD(){
  ctx.save();ctx.font='bold 14px "Courier New"';ctx.shadowBlur=4;
  ctx.fillStyle='#00ffff';ctx.shadowColor='#00ffff';ctx.textAlign='left';
  ctx.fillText('SCORE  '+score,12,20);ctx.fillText('HI     '+hiScore,12,38);ctx.fillText('LV     '+level,12,56);
  ctx.fillStyle='#ffaa00';ctx.shadowColor='#ffaa00';
  ctx.fillText('GUN    '+'▮'.repeat(player.gunLevel)+'▯'.repeat(player.maxGunLevel-player.gunLevel),12,74);
  ctx.textAlign='right';ctx.fillStyle='#ff4488';ctx.shadowColor='#ff4488';
  ctx.fillText('LIVES  '+'♥'.repeat(lives),CW-12,20);
  if(player.allies.length>0){ctx.fillStyle='#00ccff';ctx.shadowColor='#00ccff';ctx.fillText('WING  '+'★'.repeat(player.allies.length),CW-12,38);}
  const bw=100,bh=8,bx=CW-12-bw,by=48;
  ctx.fillStyle='rgba(0,40,60,.7)';ctx.fillRect(bx,by,bw,bh);
  const lf=player.loopActive?1:(player.loopCharge/100);
  const lc=player.loopActive?'#00ffff':(player.loopCharge>=100?'#ffff00':'#0088cc');
  ctx.fillStyle=lc;
  if(player.loopActive){ctx.shadowBlur=14;ctx.shadowColor='#00ffff';}
  ctx.fillRect(bx,by,bw*lf,bh);
  ctx.strokeStyle='rgba(0,200,255,.5)';ctx.lineWidth=1;ctx.strokeRect(bx,by,bw,bh);
  ctx.fillStyle='#aaa';ctx.shadowBlur=0;ctx.font='10px "Courier New"';ctx.fillText('LOOP',bx-36,by+7);
  if(isPaused){
    ctx.textAlign='center';ctx.font='bold 28px "Courier New"';
    ctx.fillStyle='#ffff00';ctx.shadowColor='#ffff00';ctx.shadowBlur=16;ctx.fillText('PAUSED',CW/2,CH/2);
  }
  ctx.restore();
}

// ---- Menu / GameOver -----------------------------------------
function drawMenu(){
  ctx.save();ctx.textAlign='center';
  ctx.font='bold 42px "Courier New"';ctx.fillStyle='#00ffff';ctx.shadowBlur=28;ctx.shadowColor='#00ffff';
  ctx.fillText('1944',CW/2,CH*.22);
  ctx.font='bold 16px "Courier New"';ctx.fillStyle='#88eeff';ctx.shadowBlur=12;ctx.fillText('PACIFIC STRIKE 3D',CW/2,CH*.3);
  ctx.font='12px "Courier New"';ctx.fillStyle='#aaffff';ctx.shadowBlur=0;ctx.fillText('v5 · 追尾视角 3D 重制',CW/2,CH*.36);
  ctx.fillStyle='#ccffff';
  const lines=['手指拖动 = 飞机机动，自动开火','敌机从地平线深处来袭','准星对准敌机即可命中','拾取 P 升级火力 · W 僚机 · ♥ 生命','充满 LOOP 释放清屏大招','每 3 关遭遇巨型 BOSS','键盘：方向键 L大招 M静音 P暂停'];
  lines.forEach((l,i)=>{ctx.fillText(l,CW/2,CH*.46+i*22);});
  const blink=Math.floor(Date.now()/550)%2;
  if(blink){ctx.font='bold 15px "Courier New"';ctx.fillStyle='#ffff00';ctx.shadowBlur=10;ctx.shadowColor='#ffff00';
    ctx.fillText('触摸屏幕开始游戏',CW/2,CH*.85);}
  if(hiScore>0){ctx.shadowBlur=0;ctx.fillStyle='#ff9900';ctx.font='13px "Courier New"';ctx.fillText('BEST: '+hiScore,CW/2,CH*.92);}
  ctx.restore();
}
function drawGameOver(){
  ctx.save();ctx.textAlign='center';
  ctx.font='bold 36px "Courier New"';ctx.fillStyle='#ff2200';ctx.shadowBlur=24;ctx.shadowColor='#ff3300';ctx.fillText('GAME OVER',CW/2,CH*.3);
  ctx.font='18px "Courier New"';ctx.fillStyle='#00ffff';ctx.shadowColor='#00ffff';ctx.shadowBlur=10;ctx.fillText('SCORE  '+score,CW/2,CH*.44);
  if(score>=hiScore&&score>0){ctx.fillStyle='#ffdd00';ctx.shadowColor='#ffdd00';ctx.fillText('✦ NEW RECORD ✦',CW/2,CH*.54);}
  const blink=Math.floor(Date.now()/600)%2;
  if(blink){ctx.font='bold 14px "Courier New"';ctx.fillStyle='#ffffff';ctx.shadowBlur=6;ctx.fillText('触摸屏幕再来一局',CW/2,CH*.72);}
  ctx.restore();
}

// ---- Render（画家算法：远→近） -------------------------------
function render(){
  ctx.save();ctx.translate(shakeX,shakeY);
  drawSky();drawSea();
  // 收集所有纵深物件，按 z 降序绘制
  const items=[];
  islands.forEach(is=>{if(is.z>-FOV+80)items.push({z:is.z,d:()=>drawIsland(is,project(is.x,0,is.z))});});
  clouds.forEach(c=>{if(c.z>-FOV+80)items.push({z:c.z,d:()=>drawCloud(c,project(c.x,c.y,c.z))});});
  enemies.forEach(e=>{if(e.z>-FOV+80)items.push({z:e.z,d:()=>drawEnemy(e,project(e.x,e.y,e.z))});});
  if(boss)items.push({z:boss.z,d:()=>drawBoss(project(boss.x,boss.y,boss.z))});
  powerups.forEach(p=>{if(p.z>-FOV+80)items.push({z:p.z,d:()=>drawPowerup(p,project(p.x,p.y,p.z))});});
  enemyBullets.forEach(b=>{if(b.z>-FOV+80)items.push({z:b.z,d:()=>drawEnemyBullet(b,project(b.x,b.y,b.z))});});
  playerBullets.forEach(b=>{items.push({z:b.z,d:()=>drawPlayerBullet(b,project(b.x,b.y,b.z))});});
  particles.forEach(p=>{items.push({z:p.z,d:()=>drawParticle(p,project(p.x,p.y,p.z))});});
  items.sort((a,b)=>b.z-a.z);
  items.forEach(it=>it.d());

  if(gameState===GS.MENU){drawMenu();ctx.restore();return;}
  if(gameState===GS.OVER){drawGameOver();ctx.restore();return;}
  drawCrosshair();
  if(gameState===GS.PLAY||gameState===GS.DEAD)drawPlayer();
  drawBossWarning();
  drawHUD();
  ctx.restore();
}

// ---- Main loop -----------------------------------------------
function loop(){
  if(gameState===GS.PLAY&&!isPaused){
    update();
  } else if(gameState===GS.DEAD){
    frame++;
    updateSea(20);updateParticles();updateShake();
    clouds.forEach(c=>{c.z-=6;if(c.z<-200)Object.assign(c,newCloud(false));});
    deadTimer--;
    if(deadTimer<=0){resetPlayer();playerBullets=[];enemyBullets=[];player.loopCharge=0;gameState=GS.PLAY;}
  } else {
    frame++;
    updateSea(14);updateParticles();updateShake();
    clouds.forEach(c=>{c.z-=5;c.x+=c.drift;if(c.z<-200)Object.assign(c,newCloud(false));});
    islands.forEach(is=>{is.z-=9;if(is.z<-150)Object.assign(is,newIsland(false));});
  }
  render();requestAnimationFrame(loop);
}

// ---- Boot ----------------------------------------------------
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
resize();resetPlayer();loop();
</script>
